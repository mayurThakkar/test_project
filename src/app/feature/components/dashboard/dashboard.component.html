<div class="dashboard-wrapper">
  <app-app-toolbar
    [pageTitle]="'Dashboard'"
    [pageIcon]="'dashboard'"
    [showBackButton]="false"
    [showNavLinks]="true"
  ></app-app-toolbar>

  <div class="dashboard-content">
    <div class="welcome-section">
      <div class="welcome-card">
        <h1 class="welcome-title">Welcome!</h1>
        <p class="welcome-message">
          Hello <strong>{{ authService.user()?.email }}</strong
          >, you are successfully logged in to your dashboard.
        </p>
      </div>
    </div>

    <div class="action-cards">
      <mat-card class="action-card clickable" routerLink="/list">
        <mat-card-header>
          <div mat-card-avatar class="card-avatar primary-avatar">
            <mat-icon>list_alt</mat-icon>
          </div>
          <mat-card-title>Items List</mat-card-title>
          <mat-card-subtitle>View and manage items</mat-card-subtitle>
          <button mat-raised-button color="primary" routerLink="/list">
            <mat-icon>arrow_forward</mat-icon>
            Go to Items
          </button>
        </mat-card-header>
      </mat-card>
    </div>
  </div>
</div>
